<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to TechNova Account - Access your order history and saved items.">
  <title>Login - TechNova Store</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-container">
      <a href="index.html" class="logo">
        <i class="fas fa-bolt"></i> Tech<span>Nova</span>
      </a>

      <nav id="nav-menu" class="nav-menu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="shop.html" class="nav-link">Shop</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>

      <div class="header-actions">
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle Dark/Light Mode">
          <i class="fas fa-moon"></i>
        </button>

        <a href="cart.html" class="icon-btn" title="View Shopping Cart">
          <i class="fas fa-shopping-bag"></i>
          <span class="cart-count">0</span>
        </a>

        <div id="mobile-menu-btn" class="mobile-menu-btn">
          <i class="fas fa-bars"></i>
        </div>
      </div>
    </div>
  </header>

  <!-- AUTH WRAPPER -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
          <i class="fas fa-bolt"></i> Tech<span>Nova</span>
        </a>
        <h2>Welcome Back</h2>
        <p>Please enter your credentials to log in to your account.</p>
      </div>

      <form id="login-form">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="name@example.com">
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="login-password">Password</label>
            <a href="#" style="font-size: 0.8rem; color: var(--primary);">Forgot Password?</a>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••">
        </div>

        <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
          <input type="checkbox" id="remember-me" style="accent-color: var(--primary); width: 16px; height: 16px;">
          <label for="remember-me" style="font-size: 0.9rem; color: var(--text-muted); cursor: pointer;">Remember me for 30 days</label>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          Log In <i class="fas fa-sign-in-alt"></i>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register Now</a>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border-top: none;">
        <p>&copy; 2026 TechNova E-Commerce Store. All Rights Reserved.</p>
        <span class="diploma-tag"><i class="fas fa-graduation-cap"></i> Diploma Student Project</span>
      </div>
    </div>
  </footer>


</body>
</html>
